[project]
name = "dxb-prices"
version = "0.1.0"
description = "Dubai apartment sale price model trained on Dubai Land Department open transaction data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farah Sharif" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141,<1",
    "lightgbm>=4.6,<5",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
train = [
    "evidently>=0.7.20,<0.8",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "mlflow>=3.5,<4",
    "pyarrow>=21",
    "shap>=0.48,<1",
]
ui = [
    "httpx>=0.28,<1",
    "streamlit>=1.50,<2",
]

[project.scripts]
dxb-prices = "dxb_prices.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pytest>=8.4",
    "pytest-cov>=7",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxb_prices"]

[tool.uv]
default-groups = ["dev"]
# Linux (CI, Docker), Windows and Apple silicon. Intel macOS is left out because
# numba has no current wheels there and would fall back to a 2021 source build.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PL", "NPY", "PD"]
ignore = [
    "PLR0913",  # data pipelines take many explicit keyword arguments
    "PLR2004",  # thresholds are named in config; small literals in tests are fine
    "PLC0415",  # optional extras (mlflow, shap, evidently, streamlit) are imported lazily
]

[tool.ruff.lint.per-file-ignores]
# Arabic letters are the point of these files, not look-alike characters.
"src/dxb_prices/normalise.py" = ["RUF001", "RUF002", "RUF003"]
"src/dxb_prices/fixture.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "evidently.*", "mlflow.*", "streamlit.*", "matplotlib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
# Deprecation notices raised inside third-party libraries, not by this code.
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:evidently.*",
    "ignore::DeprecationWarning:litestar.*",
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
source = ["dxb_prices"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
